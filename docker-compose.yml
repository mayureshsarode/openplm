services:
  postgres:
    image: postgres:16-alpine
    container_name: openplm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openplm
      POSTGRES_USER: openplm
      POSTGRES_PASSWORD: openplm
    ports:
      - "5432:5432"
    volumes:
      - openplm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openplm -d openplm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  openplm-pgdata:
